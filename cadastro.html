<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
    <link rel="stylesheet" href="ong.css">
</head>

<body>

    <header>
        <h1>ONG Esperança</h1>

        <nav>
            <button class="menu-toggle" onclick="abrirMenu()">☰</button>

            <div class="menu">
                <a href="index.html">Início</a>

                <div class="dropdown">
                    <a href="projetos.html">Projetos ▼</a>

                    <div class="submenu">
                        <a href="#">Projeto Social</a>
                        <a href="#">Voluntariado</a>
                    </div>
                </div>

                <a href="cadastro.html">Cadastro</a>
            </div>
        </nav>
    </header>

    <main>
        <section>

            <h2>Cadastre-se para participar</h2>

            <form>

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                </fieldset>

                <fieldset>

                    <legend>Contato</legend>

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        pattern="[0-9]{10,11}"
                        required
                    >

                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade"
                        required
                    >

                </fieldset>

                <fieldset>

                    <legend>Documentos</legend>

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        pattern="[0-9]{11}"
                        required
                    >

                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="Digite seu CEP"
                        pattern="[0-9]{8}"
                        required
                    >

                </fieldset>

                <fieldset>

                    <legend>Acesso</legend>

                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </fieldset>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>
    </main>

    <footer>

        <p>
            &copy; 2026 ONG Esperança - Todos os direitos reservados.
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="app.js"></script>

    <script type="module" src="formulario.js"></script>

</body>
</html>
